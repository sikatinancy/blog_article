{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-primary mb-4">Contact</h2>
    <div id="alert"></div>

    <form id="contactForm">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700">Sujet</label>
            <input type="text" name="subject" required class="w-full p-2 border rounded">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700">Message</label>
            <textarea name="message" required class="w-full p-2 border rounded" rows="5"></textarea>
        </div>
        {% if not user.is_authenticated %}
        <div class="mb-4">
            <label class="block text-gray-700">Email</label>
            <input type="email" name="email" required class="w-full p-2 border rounded">
        </div>
        {% endif %}
        <button type="submit" class="bg-accent text-white p-2 rounded hover:bg-orange-700 w-full">
            Envoyer
        </button>
    </form>
</div>

<script>
document.getElementById('contactForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));

    const alert = document.getElementById('alert');
    alert.innerHTML = '<p class="text-blue-600">Envoi...</p>';

    try {
        const res = await fetch('/api/contact/messages/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            alert.innerHTML = '<p class="text-green-500">Message envoyé ! Confirmation reçue par e-mail.</p>';
            e.target.reset();
        } else {
            alert.innerHTML = '<p class="text-red-500">Erreur.</p>';
        }
    } catch (err) {
        alert.innerHTML = '<p class="text-red-500">Erreur réseau.</p>';
    }
};
</script>
{% endblock %}
