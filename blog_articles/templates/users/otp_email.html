<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Votre code de vérification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height:1.6;">
  <h2>Bonjour,</h2>
  <p>Voici votre code de vérification pour activer votre compte :</p>
  <div style="font-size:24px; font-weight:bold; margin: 10px 0; padding:10px; border:1px solid #eee; display:inline-block;">
    {{ code }}
  </div>
  <p>Ce code expire dans 15 minutes.</p>
  <p>Si vous n'avez pas demandé ce code, ignorez cet email.</p>
  <p>Cordialement,<br>Équipe</p>
</body>
</html>
