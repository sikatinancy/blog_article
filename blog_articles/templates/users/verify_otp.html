<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Vérification OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; }
        button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 20px 0; font-weight: bold; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
<div class="card">
    <h2>Confirmez votre compte</h2>
    <p>Entrez le code à 6 chiffres envoyé à<br><strong>{{ request.GET.identifier }}</strong></p>

    <form id="otpForm">
        {% csrf_token %}
        <input type="hidden" name="identifier" value="{{ request.GET.identifier }}">
        <input type="text" name="code" maxlength="6" placeholder="123456" required autofocus>
        <button type="submit">Vérifier le code</button>
    </form>

    <div id="message"></div>
</div>

<script>
document.getElementById("otpForm").onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const msg = document.getElementById("message");

    try {
        const res = await fetch("/users/api/verify-otp/", {
            method: "POST",
            body: formData,
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        const data = await res.json();

        if (data.success) {
            msg.innerHTML = `<div class="success">${data.message}</div>`;
            setTimeout(() => window.location.href = "/users/login/", 2000);
        } else {
            msg.innerHTML = `<div class="error">${data.error || "Code incorrect"}</div>`;
            if (data.redirect_to) {
                setTimeout(() => window.location.href = data.redirect_to, 2000);
            }
        }
    } catch (err) {
        msg.innerHTML = `<div class="error">Erreur réseau</div>`;
    }
};
</script>
</body>
</html>
