{% extends 'base.html' %}
{% block content %}
<style>
	.profile-edit-page { max-width: 820px; margin: 0 auto; padding: 34px 16px 60px; }
	.profile-edit-card { display: grid; grid-template-columns: 220px minmax(0, 1fr); background: #fff; border: 1px solid #dbe4f0; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 28px rgba(30,58,138,.1); }
	.profile-edit-intro { padding: 28px 22px; background: linear-gradient(150deg, #1e3a8a, #2563eb); color: #fff; }
	.profile-edit-intro h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
	.profile-edit-intro p { color: rgba(255,255,255,.8); line-height: 1.5; font-size: .92rem; }
	.profile-edit-avatar { width: 86px; height: 86px; margin-bottom: 22px; border-radius: 50%; display: grid; place-items: center; background: #ff9256; color: #fff; font-size: 2rem; font-weight: 800; overflow: hidden; }
	.profile-edit-avatar img { width: 100%; height: 100%; object-fit: cover; }
	.profile-edit-form { padding: 28px; }
	.profile-edit-form label { display: block; color: #334155; font-weight: 700; margin-bottom: 16px; }
	.profile-edit-form input { display: block; width: 100%; margin-top: 7px; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
	.profile-edit-form input:focus { outline: 3px solid rgba(37,99,235,.14); border-color: #2563eb; }
	.profile-edit-actions { display: flex; gap: 10px; margin-top: 24px; }
	.profile-edit-actions button, .profile-edit-actions a { padding: 12px 18px; border: 0; border-radius: 8px; color: #fff; font-weight: 800; text-decoration: none; cursor: pointer; }
	.profile-edit-actions button { background: #2563eb; }
	.profile-edit-actions button:hover { background: #1e3a8a; }
	.profile-edit-actions a { background: #64748b; }
	@media (max-width: 650px) { .profile-edit-card { grid-template-columns: 1fr; } .profile-edit-intro { padding: 24px; } .profile-edit-avatar { margin-bottom: 14px; } }
</style>
<div class="profile-edit-page"><section class="profile-edit-card"><div class="profile-edit-intro"><div class="profile-edit-avatar">{% if profile.profile_image %}<img src="{{ profile.profile_image.url }}" alt="Photo de {{ user.username }}">{% else %}{{ user.username.0|upper }}{% endif %}</div><h1>Modifier mon profil</h1><p>Mettez à jour vos informations personnelles et votre photo de profil.</p></div><div class="profile-edit-form"><form method="post" enctype="multipart/form-data">{% csrf_token %}<label for="username">Nom d'utilisateur<input id="username" name="username" value="{{ user.username }}" required></label><label for="email">Email<input id="email" type="email" name="email" value="{{ user.email }}" required></label><label for="birth_date">Date de naissance<input id="birth_date" type="date" name="birth_date" value="{{ profile.birth_date|date:'Y-m-d' }}"></label><label for="profile_image">Photo de profil<input id="profile_image" type="file" name="profile_image" accept="image/*"></label><label for="password">Nouveau mot de passe <span style="font-weight:400;color:#64748b;">(facultatif)</span><input id="password" type="password" name="password" minlength="8"></label><div class="profile-edit-actions"><button type="submit">Enregistrer les modifications</button><a href="{% url 'users:dashboard' %}">Annuler</a></div></form></div></section></div>
{% endblock %}
